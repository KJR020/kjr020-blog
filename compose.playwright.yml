name: kjr020-blog-playwright

services:
  e2e:
    image: kjr020-blog-playwright:local
    build:
      context: .
      dockerfile: Dockerfile.playwright
      secrets:
        - npmrc
    init: true
    ipc: host
    environment:
      CI: "true"
      PUBLIC_GISCUS_REPO: "${PUBLIC_GISCUS_REPO:-}"
      PUBLIC_GISCUS_REPO_ID: "${PUBLIC_GISCUS_REPO_ID:-}"
      PUBLIC_GISCUS_CATEGORY: "${PUBLIC_GISCUS_CATEGORY:-}"
      PUBLIC_GISCUS_CATEGORY_ID: "${PUBLIC_GISCUS_CATEGORY_ID:-}"

  update-snapshots:
    extends:
      service: e2e
    command:
      - pnpm
      - exec
      - playwright
      - test
      - e2e/snapshot.spec.ts
      - --update-snapshots
    volumes:
      # 更新対象だけを書き込み可能にし、その他の生成物はコンテナ内で破棄する。
      - ./e2e/snapshot.spec.ts-snapshots:/app/e2e/snapshot.spec.ts-snapshots

secrets:
  # CIとローカルで使用しているTakumi Guardの認証情報をビルド時だけ渡す。
  npmrc:
    file: "${HOME}/.npmrc"
