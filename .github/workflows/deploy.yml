name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  npm_config_registry: https://npm.flatt.tech

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Restore generated image cache
        id: generated-image-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/generated-images
          key: generated-images-v1-linux-node22-${{ hashFiles('src/lib/generated-images/**', 'src/styles/**', 'package.json', 'pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            generated-images-v1-linux-node22-

      - name: Restore previous published images
        id: previous-published-images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/thumbnail-deployment-artifact.sh restore

      - name: Configure Takumi Guard auth
        run: echo "//npm.flatt.tech/:_authToken=${{ secrets.TAKUMI_GUARD_TOKEN }}" >> ~/.npmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}

      - name: Save generated image cache
        if: success()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/generated-images
          key: generated-images-v1-linux-node22-${{ hashFiles('src/lib/generated-images/**', 'src/styles/**', 'package.json', 'pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Archive published images and manifest
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-generated-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/generated-images/
            dist/generated-images-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Merge previous published images
        if: success()
        run: |
          for purpose in card ogp; do
            if [[ -d ".thumbnail-previous/generated-images/$purpose" ]]; then
              mkdir -p "dist/generated-images/$purpose"
              cp -Rn ".thumbnail-previous/generated-images/$purpose/." "dist/generated-images/$purpose/"
            fi
          done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=kjr020-blog --commit-dirty=true
